{% if data | is_iter %}
    <ul>
        {% for value in data %}
            <li>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                    <span style="background-color: {{ value }}; width: 20px; height: 20px; display: inline-block; border-radius: 4px; border: 1px solid #dee2e6;"></span>
                    <code>{{ value }}</code>
                </div>
            </li>
        {% endfor %}
    </ul>
{% else %}
    {% if data %}
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background-color: {{ data }}; width: 20px; height: 20px; display: inline-block; border-radius: 4px; border: 1px solid #dee2e6;"></span>
            <code>{{ data }}</code>
        </div>
    {% else %}
        <span class="text-muted">Не указан</span>
    {% endif %}
{% endif %}
