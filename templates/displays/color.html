{% macro render(field, val, obj) %}
  {% if val %}
    <div class="d-flex align-items-center">
      <span class="me-2" style="background-color: {{ val }}; width: 24px; height: 24px; display: inline-block; border-radius: 4px; border: 1px solid #dee2e6;"></span>
      <code>{{ val }}</code>
    </div>
  {% else %}
    <span class="text-muted">{{ val }}</span>
  {% endif %}
{% endmacro %}
